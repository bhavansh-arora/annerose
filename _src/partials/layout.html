<html lang="en-CA" class="{{page.htmlclass}}">
<head>

  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">

    (function(d){d.classList.add('js');try{if(sessionStorage.getItem('ar_seen'))d.classList.add('no-preloader')}catch(e){}})(document.documentElement);

  <script type="application/ld+json">

    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "Coach Anne Rose — Leadership & Intuitive Life Coaching",
    "url": "https://www.annerose.com/",
    "image": "https://www.annerose.com/assets/img/anne-portrait.webp",
    "telephone": "+1-416-557-1177",
    "address": { "@type": "PostalAddress", "addressLocality": "Toronto", "addressRegion": "ON", "addressCountry": "CA" },
    "areaServed": ["Toronto", "Canada", "Worldwide (online)"],
    "founder": { "@type": "Person", "name": "Anne Rose", "jobTitle": "Leadership & Intuitive Life Coach, PCC, CPCC", "sameAs": ["https://www.linkedin.com/in/coachannerose"] },

<body data-page="{{page.nav}}">
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main">
{{BODY}}
