<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/fonts.css">
<style>
  :root { --wine:#561526; --wine2:#3b0c18; --gold:#e2c78f; --ivory:#f5efe6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: var(--ivory);
    background: radial-gradient(70% 90% at 78% 100%, #7d2340 0%, var(--wine) 45%, var(--wine2) 100%); font-family: "Inter Tight", sans-serif; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(226,199,143,.16) 1.4px, transparent 1.5px); background-size: 24px 24px; }
  .ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(226,199,143,.18); }
  .r1 { width: 760px; height: 760px; right: -190px; bottom: -400px; }
  .r2 { width: 540px; height: 540px; right: -80px; bottom: -290px; border-style: dashed; }
  .giant { position: absolute; right: -40px; top: 140px; font-family: "Instrument Serif", serif; font-style: italic; font-size: 230px; line-height: .8; color: var(--gold); opacity: .92; letter-spacing: -5px; }
  .anne { position: absolute; right: 70px; bottom: 0; height: 560px; filter: drop-shadow(0 30px 40px rgba(20,4,8,.5)); }
  .left { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 560px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .mono { width: 64px; height: 64px; border-radius: 50%; background: var(--gold); color: var(--wine2); display: grid; place-items: center; font-family: "Instrument Serif", serif; font-style: italic; font-size: 34px; }
  .bn { font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -1.2px; line-height: 1; }
  .bn em { font-family: "Instrument Serif", serif; font-weight: 400; color: var(--gold); letter-spacing: 0; font-size: 34px; }
  .bs { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; color: rgba(245,239,230,.7); margin-top: 6px; }
  h1 { margin-top: auto; font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 74px; line-height: .95; letter-spacing: -3.5px; }
  h1 em { font-family: "Instrument Serif", serif; font-weight: 400; color: var(--gold); letter-spacing: -1px; font-size: 84px; }
  .chips { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
  .chip { padding: 11px 18px; border-radius: 999px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16); font-size: 18px; font-weight: 600; }
  .chip b { color: var(--gold); }
  .url { margin-top: 26px; font-size: 18px; color: rgba(245,239,230,.75); letter-spacing: .5px; }
</style></head>
<body><div class="og">
  <div class="dots"></div><div class="ring r1"></div><div class="ring r2"></div>
  <div class="giant">knowing</div>
  <img class="anne" src="../../assets/img/anne-standing-cut.webp" alt="">
  <div class="left">
    <div class="brand"><div class="mono">ar</div><div><div class="bn">Anne <em>Rose</em></div><div class="bs">Leadership &amp; Life Coach</div></div></div>
    <h1>Embrace the <em>knowing</em> within.</h1>
    <div class="chips"><span class="chip"><b>95%</b> of goals in ≤ 3 months</span><span class="chip">Toronto · Online</span></div>
    <div class="url">annerose.codebunny.net</div>
  </div>
</div></body></html>
